<div class="search-container">

        onkeyup="filterTiles()"

</div>



<div class="container">

    
<div class="location-ref">

<div class="app-grid">


<a

>

    <div

<a

</div>

<script>

function filterTiles() {

    let input =
        document
        .getElementById("searchInput")
        .value
        .toLowerCase();

    let cards =
        document.querySelectorAll(
            ".app-card"
        );

    cards.forEach(card => {

        let titleElement =
            card.querySelector("h3");

        let descElement =
            card.querySelector("p");

        let title =
            titleElement
            ? titleElement.innerText.toLowerCase()
            : "";

        let desc =
            descElement
            ? descElement.innerText.toLowerCase()
            : "";

        if (
            title.includes(input) ||
            desc.includes(input)
        ) {

            card.style.display =
                "flex";

        } else {

            card.style.display =
                "none";
        }

    });

}


document.addEventListener(
    "contextmenu",
    event => event.preventDefault()
);


document.addEventListener(
    "copy",
    event => event.preventDefault()
);

</script>
